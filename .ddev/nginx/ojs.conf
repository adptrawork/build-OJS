# OJS/PKP path-info handling.
# URLs seperti /index.php/index/install tidak berakhiran ".php" sehingga blok
# "location ~ \.php$" tidak cocok dan PATH_INFO hilang -> redirect loop.
# Blok ini mempertahankan PATH_INFO (diambil dari ojs-dev yang sudah terbukti).

location /index.php {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_index index.php;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_intercept_errors off;
    fastcgi_read_timeout 10m;
    fastcgi_param SERVER_NAME $host;
    fastcgi_param HTTPS $fcgi_https;
}

location = /sitemap.xml {
    rewrite ^ /index.php/JEKI/en/sitemap last;
}
