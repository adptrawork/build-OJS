name: Check FTP directory

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: List FTP root directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          PROTO="ftp"
          if [ "$FTP_PORT" = "22" ]; then PROTO="sftp"; fi
          echo "Protocol: $PROTO"
          echo "Server: $FTP_SERVER"
          echo "Port: $FTP_PORT"
          echo "--- listing ---"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$PROTO://$FTP_SERVER" -e "set ssl:verify-certificate no; set sftp:auto-confirm yes; cat error_log | tail -n 15; bye"
